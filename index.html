<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style></head><body><title>Laser Arena</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout : appli mobile à onglets ; écran Live plein écran avec barre de commande fixe.
   Thème unique sombre « salle d'arène » choisi volontairement. */
:root{
  color-scheme: dark;
  --bg:#0A0E16; --surface:#121925; --surface-2:#19222F; --surface-3:#222D3D;
  --line:rgba(150,172,214,.14); --text:#E9EFF9; --muted:#93A1B9; --dim:#5D6A82;
  --accent:#4FD1FF; --accent-ink:#03141C;
  --ok:#3DDC97; --warn:#FFB020; --danger:#FF4D5E; --gold:#FFC94A;
  --t-red:#FF4D5E; --t-blue:#3D8BFF; --t-purple:#B06BFF; --t-green:#33D17A;
  --t-yellow:#FFD23F; --t-orange:#FF8A3D; --t-cyan:#2EE6F0; --t-pink:#FF6FB5;
  --f-display:"Chakra Petch", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:720px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#app.live-mode{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.sync.on i{background:var(--ok)} .sync.wait i{background:var(--warn)}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(10,14,22,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px))}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11px;font-weight:600}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* Blocs */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flush{padding:4px 14px}
.label{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.label small{letter-spacing:0;text-transform:none;font-family:var(--f-body);font-weight:500;color:var(--dim);font-size:12px}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row>.grow{flex:1;min-width:0}
.list>*{padding-block:11px;border-bottom:1px solid var(--line)}
.list>*:last-child{border-bottom:0}
.tap{background:none;border:0;width:100%;text-align:left;padding-inline:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block;box-shadow:0 0 8px var(--c, transparent);background:var(--c)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--surface-3);font-size:12px;font-weight:600;color:var(--accent)}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px;text-transform:uppercase}
.pill.out{background:var(--danger);color:#1A0306}
.pill.live{background:rgba(61,220,151,.15);color:var(--ok)}
.pill.pause{background:rgba(255,176,32,.15);color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.tile b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--surface-3);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:rgba(255,77,94,.16);color:var(--danger);border:1px solid rgba(255,77,94,.5)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;flex:none}
.check.on{background:var(--c, var(--accent));border-color:var(--c, var(--accent))}
.check.on::after{content:"";width:7px;height:12px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper .ctl{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.stepper .ctl button{width:40px;height:36px;border:0;background:none;font-size:20px;font-weight:600}
.stepper .ctl output{min-width:62px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.toggle{position:relative;width:48px;height:28px;border-radius:999px;background:var(--surface-3);border:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text);transition:transform .15s}
.toggle[aria-pressed="true"]{background:var(--ok)}
.toggle[aria-pressed="true"]::after{transform:translateX(20px)}
.note{font-size:13px;color:var(--muted)}
.hero{display:flex;gap:14px;align-items:center;padding-block:4px}
.hero .mark{width:54px;height:54px;flex:none}
.hero h2{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:.06em;margin:0;line-height:1}
.hero p{margin:4px 0 0;color:var(--muted)}
.empty{text-align:center;padding:22px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{margin:0;font-family:var(--f-display);font-size:19px}
.empty p{margin:0;color:var(--muted);max-width:42ch}
.modecard{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;width:100%}
.modecard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.modecard b{font-family:var(--f-display);font-size:16px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;flex:none;background:color-mix(in srgb, var(--c, var(--accent)) 22%, transparent);border:1.5px solid var(--c, var(--accent))}
.vd{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#06110C;flex:none}

/* Live */
.clock{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,19vw,92px);line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clockmeta{text-align:center;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--muted);margin-top:4px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px}
.team{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:10px 8px 12px;text-align:center;position:relative;overflow:hidden;min-width:0}
.team::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c);box-shadow:0 0 14px var(--c)}
.team.lead{border-color:color-mix(in srgb, var(--c) 70%, transparent)}
.team .nm{font-weight:700;font-size:14px;margin-top:4px}
.team .sc{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1.05;color:var(--c);font-variant-numeric:tabular-nums}
.team .sub{font-size:11px;color:var(--muted);font-weight:600}
.team.down{opacity:.45}
.prow{display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .who{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.prow .who b{font-size:16px}
.prow.down .who b{text-decoration:line-through;color:var(--muted)}
.pts{text-align:center;min-width:42px}
.pts b{font-family:var(--f-display);font-size:24px;display:block;line-height:1;font-variant-numeric:tabular-nums}
.pts small{font-size:11px;color:var(--muted)}
.rb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:22px}
.large .rb{width:58px;height:58px}
.rb.hit{background:rgba(255,77,94,.14);border:1.5px solid var(--danger);color:var(--danger)}
.rb.plus{background:rgba(79,209,255,.12);border:1.5px solid var(--accent);color:var(--accent)}
.rb svg{width:22px;height:22px}
.rb:disabled{opacity:.3}
.hearts{display:flex;gap:2px;color:var(--danger);font-size:12px;line-height:1}
.hearts .x{color:var(--dim)}
.bar{display:flex;align-items:center;gap:8px;max-width:180px}
.bar .tr{flex:1;height:6px;border-radius:9px;background:var(--surface-3);overflow:hidden}
.bar .fl{height:100%;border-radius:9px;background:var(--c)}
.bar span{font-size:12px;color:var(--muted);font-weight:700;min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
.controls{position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(10,14,22,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:10px max(16px, env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.controls .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.controls .main{flex:1;height:56px;border-radius:14px;border:0;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent)}
.controls .main.pausebtn{background:var(--warn)}
.controls .sq{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.controls .sq svg{width:22px;height:22px}
.controls .sq.end{border-color:rgba(255,77,94,.6);color:var(--danger);background:rgba(255,77,94,.12)}
.large .controls .main,.large .controls .sq{height:66px}
.zonebtn{border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;border:1.5px solid var(--c);color:var(--c);background:none;white-space:nowrap}
.zonebtn[aria-pressed="true"]{background:var(--c);color:#0A0E16}
.zone{display:flex;align-items:center;gap:10px}
.zone .zl{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none;background:var(--c, var(--surface-3));color:#0A0E16}
.zone .opts{display:flex;gap:6px;overflow-x:auto;min-width:0;padding-block:2px}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px}
.log div{display:flex;gap:10px;color:var(--muted)}
.log time{color:var(--dim);font-variant-numeric:tabular-nums;flex:none}

/* Fenêtres */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(3,6,12,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;border:1px solid var(--line);width:100%;max-width:720px;max-height:88%;overflow:auto;
  padding:18px max(16px, env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
.countdown{position:fixed;inset:0;z-index:30;background:rgba(3,6,12,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.countdown b{font-family:var(--f-display);font-size:160px;line-height:1;color:var(--accent);text-shadow:0 0 30px rgba(79,209,255,.6)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--surface-3);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90%}
.winner{text-align:center;padding:20px 14px}
.winner .cup{width:52px;height:52px;margin:0 auto 6px;color:var(--gold)}
.winner h2{font-family:var(--f-display);font-size:28px;margin:0;color:var(--c, var(--text));text-wrap:balance}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:right;font-weight:700;padding:6px 4px}
td{padding:8px 4px;border-top:1px solid var(--line);text-align:right}
th:nth-child(2),td:nth-child(2){text-align:left}
th:first-child,td:first-child{text-align:left;width:26px}
.chart svg{width:100%;height:auto;display:block}
.hbar{display:grid;grid-template-columns:minmax(0,9em) 1fr auto;gap:8px;align-items:center;font-size:13px}
.hbar .tr{height:12px;background:var(--surface-3);border-radius:6px;overflow:hidden}
.hbar .fl{height:100%;background:var(--accent);border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
/* ============================================================
   LASER ARENA — version web
   Même logique que l'app iPhone : joueurs, équipes, 5 modes,
   partie en direct avec annulation, résultats, statistiques.
   Données : copie locale (hors ligne) + sauvegarde privée dans
   votre compte Claude quand elle est disponible.
   ============================================================ */

/* ---------- Constantes ---------- */
const COLORS = {
  red:{name:"Rouge",v:"var(--t-red)"}, blue:{name:"Bleu",v:"var(--t-blue)"}, purple:{name:"Violet",v:"var(--t-purple)"},
  green:{name:"Vert",v:"var(--t-green)"}, yellow:{name:"Jaune",v:"var(--t-yellow)"}, orange:{name:"Orange",v:"var(--t-orange)"},
  cyan:{name:"Cyan",v:"var(--t-cyan)"}, pink:{name:"Rose",v:"var(--t-pink)"}
};
const COLOR_ORDER = ["red","blue","green","yellow","orange","cyan","pink","purple"];
const colorAt = i => COLOR_ORDER[i % COLOR_ORDER.length];
const cv = c => (COLORS[c] || COLORS.red).v;

const MODES = {
  tdm:  {title:"Team Deathmatch", ffa:false, scoreLimit:true, captures:false, zones:false,
         sub:"Équipes contre équipes (Team Battle dans l'app Nerf). Réapparition illimitée : l'équipe qui marque le plus gagne.",
         win:"Première équipe au score limite, sinon meilleur score à la fin du temps.",
         base:{duration:10,healthMode:"hp",start:100,dmg:25,respawn:true,maxRespawns:0,respawnDelay:5,pph:1,ppe:3,scoreLimit:50}},
  ffa:  {title:"Free For All", ffa:true, scoreLimit:true, captures:false, zones:false,
         sub:"Chacun pour soi avec réapparition, comme le mode Free For All de l'app Nerf. Le meilleur score gagne.",
         win:"Premier joueur au score limite, sinon meilleur score à la fin du temps.",
         base:{duration:10,healthMode:"hp",start:100,dmg:25,respawn:true,maxRespawns:0,respawnDelay:5,pph:1,ppe:3,scoreLimit:30}},
  lms:  {title:"Last Man Standing", ffa:true, scoreLimit:false, captures:false, zones:false,
         sub:"Chacun pour soi (mode violet des blasters). Pas de réapparition : le dernier en vie gagne.",
         win:"Dernier joueur en vie. À la fin du temps : le plus de santé restante.",
         base:{duration:15,healthMode:"lives",start:5,respawn:false,pph:1,ppe:5}},
  ctf:  {title:"Capture the Flag", ffa:false, scoreLimit:false, captures:true, zones:false,
         sub:"Ramenez le drapeau adverse à votre base. Première équipe à la limite de captures.",
         win:"Limite de captures atteinte, sinon le plus de captures (puis de points).",
         base:{duration:15,healthMode:"hp",start:100,dmg:25,respawn:true,respawnDelay:5,pph:1,ppe:2,ppc:10,captureLimit:3}},
  dom:  {title:"Domination", ffa:false, scoreLimit:true, captures:false, zones:true,
         sub:"Contrôlez des zones. Chaque zone rapporte des points à intervalle régulier.",
         win:"Première équipe au score limite, sinon meilleur score (zones + touches).",
         base:{duration:15,healthMode:"hp",start:100,dmg:25,respawn:true,respawnDelay:5,pph:1,ppe:2,scoreLimit:150,zones:3,ppz:1,zoneTick:10}},
  elim: {title:"Élimination", ffa:false, scoreLimit:false, captures:false, zones:false,
         sub:"Équipes sans réapparition. La dernière équipe avec un joueur en vie gagne.",
         win:"Dernière équipe en vie. À la fin du temps : le plus de joueurs en vie.",
         base:{duration:10,healthMode:"lives",start:3,respawn:false,pph:1,ppe:3}}
};
const MODE_KEYS = Object.keys(MODES);

const EQ_KINDS = {blaster:"Blaster", vest:"Gilet / cible", flag:"Drapeau", beacon:"Balise de zone", charger:"Chargeur / piles", other:"Autre"};
const EQ_STATUS = {ready:{n:"Prêt",c:"var(--ok)"}, charging:{n:"En charge",c:"var(--warn)"}, check:{n:"À vérifier",c:"var(--t-orange)"}, broken:{n:"Hors service",c:"var(--danger)"}};

const DEFAULT_SETTINGS = {duration:10, lives:5, hp:100, countdown:5, haptics:true, keepAwake:true, showLog:true, showRemaining:true, large:false};

/* ---------- Petits outils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clock = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); };
const fmtDate = (t, time) => new Date(t).toLocaleDateString("fr-BE", time ? {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"} : {day:"numeric",month:"short",year:"numeric"});
const pct = v => Math.round(v * 100) + " %";
const plural = (n, w) => n + " " + w + (n > 1 ? "s" : "");
const initials = n => (n || "?").split(/\s+/).slice(0,2).map(w => w[0] || "").join("").toUpperCase() || "?";
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- Données ---------- */
let core = {players:[], teams:[], equipment:[], blasters:{}, settings:{...DEFAULT_SETTINGS}, modeRules:{}, updatedAt:0};
let matches = {};                 // id -> partie
let syncedIds = new Set();        // parties connues du serveur (pour propager les suppressions)
const tombstones = new Set();     // parties supprimées ici, en attente de confirmation du serveur
function removeMatch(id){ delete matches[id]; tombstones.add(id); queueWrite("match:" + id); }
const LS = "laserarena.v1";

function loadLocal(){
  try {
    const raw = localStorage.getItem(LS);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.core) core = {...core, ...d.core, settings:{...DEFAULT_SETTINGS, ...(d.core.settings||{})}};
    matches = d.matches || {};
    syncedIds = new Set(d.synced || []);
  } catch (e) { /* pas de stockage local : l'app fonctionne quand même */ }
}
function saveLocal(){
  try { localStorage.setItem(LS, JSON.stringify({core, matches, synced:[...syncedIds]})); } catch (e) {}
}
function touchCore(){ core.updatedAt = Date.now(); saveLocal(); queueWrite("core"); }
function touchMatch(m){ m.updatedAt = Date.now(); trimEvents(m); saveLocal(); queueWrite("match:" + m.id); }

/* ---------- Sauvegarde dans le compte Claude (privée) ---------- */
let db = null, base = null, dbState = "local"; // local | wait | on
const writes = new Map();
async function initDb(){
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const [dbNs, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const id = user ? await user.id() : null;
    if (!dbNs || !id) return;
    db = dbNs; base = "data/users/" + id; dbState = "wait"; renderTop();
    const coreRef = db.doc(base + "/core");
    const loadTimer = setTimeout(() => { if (dbState === "wait") { renderTop(); } }, 10000);
    coreRef.onSnapshot(snap => {
      if (!snap.exists) { if (!snap.metadata.fromCache) { clearTimeout(loadTimer); dbState = "on"; renderTop(); if (core.updatedAt) queueWrite("core"); } return; }
      const remote = clone(snap.data());
      if ((remote.updatedAt || 0) > (core.updatedAt || 0)) {
        core = {...core, ...remote, settings:{...DEFAULT_SETTINGS, ...(remote.settings||{})}};
        saveLocal(); if (!isEditing()) render();
      } else if ((remote.updatedAt || 0) < (core.updatedAt || 0)) queueWrite("core");
      if (!snap.metadata.fromCache) { clearTimeout(loadTimer); dbState = "on"; renderTop(); }
    }, () => { db = null; dbState = "local"; renderTop(); });
    coreRef.collection("matches").onSnapshot(qs => {
      if (qs.metadata.fromCache) return;
      const seen = new Set();
      let changed = false;
      qs.docs.forEach(d => {
        seen.add(d.id);
        if (tombstones.has(d.id)) return;
        const remote = clone(d.data());
        const local = matches[d.id];
        if (!local || (remote.updatedAt || 0) > (local.updatedAt || 0)) {
          if (!(live.id === d.id && local)) { matches[d.id] = remote; changed = true; }
        } else if ((remote.updatedAt || 0) < (local.updatedAt || 0)) queueWrite("match:" + d.id);
      });
      Object.keys(matches).forEach(id => {
        if (!seen.has(id)) {
          if (syncedIds.has(id)) { if (live.id !== id) { delete matches[id]; changed = true; } }
          else queueWrite("match:" + id);
        }
      });
      tombstones.forEach(id => { if (!seen.has(id)) tombstones.delete(id); });
      syncedIds = seen; saveLocal();
      if (changed && !isEditing()) render();
    }, () => {});
  } catch (e) { db = null; dbState = "local"; renderTop(); }
}
function queueWrite(key){
  if (!db) return;
  let w = writes.get(key);
  if (!w) { w = {timer:null, running:false, dirty:false}; writes.set(key, w); }
  clearTimeout(w.timer);
  w.timer = setTimeout(() => flush(key), 700);
}
async function flush(key){
  const w = writes.get(key); if (!w || !db) return;
  if (w.running) { w.dirty = true; return; }
  w.running = true;
  try {
    if (key === "core") await db.doc(base + "/core").set(clone(core));
    else {
      const id = key.slice(6);
      const ref = db.doc(base + "/core").collection("matches").doc(id);
      if (matches[id]) { await ref.set(clone(matches[id])); syncedIds.add(id); }
      else { await ref.delete(); syncedIds.delete(id); }
      saveLocal();
    }
  } catch (e) {
    if (e && (e.code === "invalid_argument" || e.code === "not_granted" || e.code === "revoked")) { db = null; dbState = "local"; renderTop(); }
    else if (e && e.code === "quota_exceeded") toast("Espace de sauvegarde plein : supprimez d'anciennes parties.");
    else if (e && e.code === "unavailable") { w.running = false; setTimeout(() => flush(key), 1500 + Math.random()*1000); return; }
  }
  w.running = false;
  if (w.dirty) { w.dirty = false; flush(key); }
}

/* ---------- Règles ---------- */
function baseRules(mode){
  return {duration:10, countdown:5, healthMode:"lives", start:5, dmg:10, respawn:false, maxRespawns:0, respawnDelay:0, powerups:false, healAmt:0, healCd:30, upgMode:"none", upgAll:{hp:0, dmg:0, ammo:0, resp:0},
          pph:1, ppe:3, scoreLimit:0, ppc:10, captureLimit:3, zones:3, ppz:1, zoneTick:10, ...MODES[mode].base};
}
function clampRules(r){
  if (!r.upgMode) r.upgMode = "none";
  if (r.healAmt && (r.healthMode === "lives" ? r.healAmt > 5 : r.healAmt < 5)) r.healAmt = 0;
  r.upgAll = {hp:0, dmg:0, ammo:0, resp:0, ...(r.upgAll || {})};
  const [lo, hi] = r.healthMode === "lives" ? [1,20] : [10,100];
  r.start = clamp(r.start, lo, hi); r.zones = clamp(r.zones, 1, 5); r.zoneTick = Math.max(5, r.zoneTick);
  return r;
}
function generatedRules(mode){
  const r = baseRules(mode), s = core.settings;
  r.duration = s.duration; r.countdown = s.countdown;
  r.start = r.healthMode === "lives" ? s.lives : s.hp;
  return clampRules(r);
}
function rulesFor(mode){ return core.modeRules[mode] ? clampRules(clone({...generatedRules(mode), ...core.modeRules[mode]})) : generatedRules(mode); }
const dmgOf = r => r.healthMode === "lives" ? 1 : Math.max(1, r.dmg);
const healthText = r => r.healthMode === "lives" ? plural(r.start, "vie") : r.start + " PV";

/* ---------- Moteur de partie ---------- */
const elapsed = (m, now = Date.now()) => m.acc + (m.resumedAt ? Math.max(0, (now - m.resumedAt) / 1000) : 0);
const limitOf = m => m.rules.duration > 0 ? m.rules.duration * 60 : null;
const isActive = m => m.phase === "playing" || m.phase === "paused";
const allP = m => m.teams.flatMap(t => t.participants);
const findP = (m, id) => allP(m).find(p => p.id === id);
const findT = (m, id) => m.teams.find(t => t.id === id);
const teamOf = (m, p) => m.teams.find(t => t.participants.includes(p));
const score = t => t.participants.reduce((a, p) => a + p.points, 0) + t.objective;
const aliveN = t => t.participants.filter(p => !p.out).length;
const healthSum = t => t.participants.filter(p => !p.out).reduce((a, p) => a + p.health, 0);
const pName = p => (core.players.find(x => x.id === p.playerId) || {}).name || p.name;

function key(t, mode){
  if (mode === "lms" || mode === "elim") {
    const last = Math.max(0, ...t.participants.map(p => p.outAt || 0));
    return [aliveN(t), healthSum(t), Math.floor(last), score(t)];
  }
  if (mode === "ctf") return [t.captures, score(t)];
  return [score(t), aliveN(t)];
}
function cmp(a, b){ for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] > b[i] ? 1 : -1; return 0; }
const rankedTeams = m => [...m.teams].sort((a, b) => cmp(key(b, m.mode), key(a, m.mode)) || a.order - b.order);
function winnerOf(m){
  const r = rankedTeams(m);
  if (!r.length) return null;
  if (r.length === 1) return r[0];
  return cmp(key(r[0], m.mode), key(r[1], m.mode)) > 0 ? r[0] : null;
}
const rankedPlayers = m => [...allP(m)].sort((a, b) => b.points - a.points || b.elims - a.elims || a.kos - b.kos || b.hits - a.hits);
const mvp = m => rankedPlayers(m)[0] || null;
const bestShooter = m => allP(m).filter(p => p.hits > 0).sort((a, b) => b.hits - a.hits)[0] || null;
const topElim = m => allP(m).filter(p => p.elims > 0).sort((a, b) => b.elims - a.elims)[0] || null;
function survivor(m){
  const al = allP(m).filter(p => !p.out).sort((a, b) => b.health - a.health || a.kos - b.kos);
  if (al.length) return al[0];
  return allP(m).sort((a, b) => (b.outAt || 0) - (a.outAt || 0))[0] || null;
}

/* Handicap : niveaux 0 à 3 → +1 vie ou +25 PV par niveau. */
const bonusAmount = (r, lvl) => (lvl || 0) * (r.healthMode === "lives" ? 1 : 25);
const maxH = (m, p) => p.maxH ?? m.rules.start;
const waiting = p => p.waitUntil != null;
function createMatch({name, date, mode, rules, teams, bonus = {}}){
  const r = clampRules(clone(rules));
  const m = {id:uid(), name, date, mode, rules:r, phase:"setup", acc:0, resumedAt:null, startedAt:null, endedAt:null,
    winnerTeamId:null, winnerSummary:"", endReason:"", zoneOwners: MODES[mode].zones ? Array(r.zones).fill("") : [], zoneTicks:0,
    teams: teams.map((t, i) => ({id:uid(), name:t.name, color:t.color, order:i, objective:0, captures:0,
      participants: t.players.map(pl => ({id:uid(), playerId:pl.id, name:pl.name, points:0, hits:0, hitsTaken:0, elims:0, kos:0,
        health:r.start + bonusAmount(r, bonus[pl.id]), maxH:r.start + bonusAmount(r, bonus[pl.id]), respawns:0, out:false, outAt:null, waitUntil:null, puUsed:false}))})),
    events:[], updatedAt:Date.now()};
  matches[m.id] = m; touchMatch(m);
  return m;
}

/* État de l'écran Live (non enregistré) */
const live = {id:null, proposal:null, overtime:false, dismissed:null, countdown:null, cdTimer:null, wake:null};

const snapP = p => ({id:p.id, points:p.points, hits:p.hits, hitsTaken:p.hitsTaken, elims:p.elims, kos:p.kos, health:p.health, respawns:p.respawns, out:p.out, outAt:p.outAt, waitUntil:p.waitUntil ?? null, puUsed:!!p.puUsed});
const snapT = t => ({id:t.id, objective:t.objective, captures:t.captures});
function addLog(m, kind, text){ m.events.push({id:uid(), t:Date.now(), el:elapsed(m), kind, text}); }

/* Toute action de jeu passe ici : copie avant/après pour pouvoir annuler, puis sauvegarde. */
function record(m, kind, text, {ps = [], ts = [], zones = false}, fn){
  if (!isActive(m)) return;
  const ev = {id:uid(), t:Date.now(), el:elapsed(m), kind, text, undo:true, pb:ps.map(snapP), tb:ts.map(snapT)};
  if (zones) ev.zb = [...m.zoneOwners];
  fn();
  ev.ta = ts.map(snapT);
  m.events.push(ev);
  haptic();
  touchMatch(m);
  evaluate(m);
  render();
}
/* Garde le document léger : seules les 40 dernières actions restent annulables. */
function trimEvents(m){
  let n = 0;
  for (let i = m.events.length - 1; i >= 0; i--) {
    const e = m.events[i];
    if (e.undo) { n++; if (n > 40) { e.undo = false; delete e.pb; delete e.tb; delete e.ta; delete e.zb; } }
  }
  if (m.events.length > 600) m.events.splice(0, m.events.length - 600);
}
const canRespawn = (p, r) => r.respawn && (r.maxRespawns === 0 || p.respawns < r.maxRespawns);
function knockOut(m, v, s, r){
  v.kos++;
  if (s) { s.elims++; s.points += r.ppe; }
  if (canRespawn(v, r)) {
    v.respawns++;
    const delay = r.respawnDelay || 0;
    if (delay > 0) { v.health = 0; v.waitUntil = elapsed(m) + delay; } // hors jeu pendant le délai
    else v.health = maxH(m, v);
  }
  else { v.out = true; v.outAt = elapsed(m); }
}
function registerHit(m, v, s, opts = {}){
  if (v.out || waiting(v)) return;
  const r = m.rules, extra = (s && r.healthMode === "hp" && s.dmgBonus) || 0;
  const dmg = Math.max(1, dmgOf(r) * (opts.mult || 1) + extra), drop = v.health - dmg <= 0;
  let text = s ? `${pName(s)} touche ${pName(v)}` : `${pName(v)} est touché`;
  if (opts.pu) text = `⚡ Tir puissant de ${pName(s)} sur ${pName(v)}`;
  if (drop) text += canRespawn(v, r) ? " · réapparition" : " · ÉLIMINÉ";
  record(m, "hit", text, {ps: s ? [v, s] : [v]}, () => {
    v.hitsTaken++; v.health = Math.max(0, v.health - dmg);
    if (s) { s.hits++; s.points += r.pph; }
    if (opts.pu && s) s.puUsed = true;
    if (v.health === 0) knockOut(m, v, s, r);
  });
}
function successHit(m, s){
  if (s.out || waiting(s)) return;
  record(m, "hit", `${pName(s)} marque une touche (+${m.rules.pph})`, {ps:[s]}, () => { s.hits++; s.points += m.rules.pph; });
}
function adjustPoints(m, p, d){
  record(m, "points", `Correction points ${pName(p)} : ${d > 0 ? "+" : ""}${d}`, {ps:[p]}, () => { p.points += d; });
}
function adjustHealth(m, p, d){
  const max = Math.max(maxH(m, p), m.rules.healthMode === "lives" ? 20 : 100);
  const nv = clamp(p.health + d, 0, max);
  if (nv === p.health) return;
  record(m, "health", `Correction santé ${pName(p)} : ${d > 0 ? "+" : ""}${d}`, {ps:[p]}, () => {
    p.health = nv;
    if (nv === 0 && !p.out) { p.out = true; p.outAt = elapsed(m); }
    else if (nv > 0 && p.out) { p.out = false; p.outAt = null; }
    if (nv > 0) p.waitUntil = null;
  });
}
function eliminate(m, p){ if (!p.out) record(m, "elim", `${pName(p)} est éliminé (manuel)`, {ps:[p]}, () => { p.health = 0; p.out = true; p.outAt = elapsed(m); p.waitUntil = null; }); }
function revive(m, p){ record(m, "revive", `${pName(p)} revient en jeu`, {ps:[p]}, () => { p.out = false; p.outAt = null; p.waitUntil = null; p.health = maxH(m, p); }); }
/* Bonus soin : sur soi (trousse de soin) ou sur un coéquipier (soin d'allié). */
function healBonus(m, user, target){
  if (user.puUsed || target.out || waiting(target)) return;
  const amt = m.rules.healthMode === "lives" ? 2 : 50;
  const text = user === target ? `⚡ Trousse de soin pour ${pName(user)}` : `⚡ ${pName(user)} soigne ${pName(target)}`;
  record(m, "bonus", text, {ps: user === target ? [user] : [user, target]}, () => {
    user.puUsed = true; target.health = Math.min(maxH(m, target), target.health + amt);
  });
}
function adjustCaptures(m, t, d){
  if (t.captures + d < 0) return;
  record(m, "capture", d > 0 ? `Drapeau capturé par ${t.name}` : `Capture retirée à ${t.name}`, {ts:[t]}, () => { t.captures += d; t.objective += d * m.rules.ppc; });
}
const ZONE = i => "ABCDE"[i] || String(i + 1);
function setZone(m, i, teamId){
  if (m.zoneOwners[i] === teamId) return;
  const t = findT(m, teamId);
  record(m, "zone", t ? `Zone ${ZONE(i)} prise par ${t.name}` : `Zone ${ZONE(i)} neutralisée`, {zones:true}, () => { m.zoneOwners[i] = teamId; });
}
/* Points de zone calculés à partir du temps de jeu : rien n'est perdu si l'écran s'éteint. */
function awardTicks(m, secs, doEval = true){
  if (!MODES[m.mode].zones || m.rules.zoneTick <= 0) return false;
  const due = Math.floor(secs / m.rules.zoneTick), miss = due - (m.zoneTicks || 0);
  if (miss <= 0) return false;
  m.zoneOwners.forEach(o => { const t = findT(m, o); if (t) t.objective += miss * m.rules.ppz; });
  m.zoneTicks = due;
  touchMatch(m);
  if (doEval) evaluate(m);
  return true;
}
function undoLast(m){
  if (!isActive(m)) return;
  const ev = [...m.events].reverse().find(e => e.undo);
  if (!ev) return;
  (ev.pb || []).forEach(s => { const p = findP(m, s.id); if (p) Object.assign(p, s); });
  (ev.tb || []).forEach((b, i) => { const a = (ev.ta || [])[i], t = findT(m, b.id); if (t && a) { t.captures += b.captures - a.captures; t.objective += b.objective - a.objective; } });
  if (ev.zb) m.zoneOwners = [...ev.zb];
  m.events = m.events.filter(e => e !== ev);
  addLog(m, "undo", "Annulé : " + ev.text);
  live.dismissed = null;
  haptic(true);
  touchMatch(m); evaluate(m); render();
}
function freeze(m, secs){ m.acc = secs; m.resumedAt = null; m.phase = "paused"; }
function startMatch(m){
  if (m.phase !== "setup") return;
  m.startedAt = Date.now(); m.resumedAt = Date.now(); m.acc = 0; m.phase = "playing";
  addLog(m, "start", "Début de la partie"); btStart(m); touchMatch(m); render();
}
function togglePause(m){
  if (m.phase === "playing") { freeze(m, elapsed(m)); addLog(m, "pause", "Pause"); }
  else if (m.phase === "paused") {
    const lim = limitOf(m);
    if (lim && elapsed(m) >= lim) live.overtime = true;
    m.resumedAt = Date.now(); m.phase = "playing";
    addLog(m, "resume", live.overtime ? "Reprise (prolongation)" : "Reprise");
  }
  touchMatch(m); render();
}
function finishMatch(m, reason){
  if (m.phase === "finished") return;
  btEnd(m);
  if (m.phase === "playing") { m.acc = elapsed(m); m.resumedAt = null; }
  awardTicks(m, m.acc, false);
  if (!m.startedAt) m.startedAt = Date.now();
  const w = winnerOf(m);
  m.winnerTeamId = w ? w.id : null;
  m.winnerSummary = w ? (MODES[m.mode].ffa ? `${w.name} remporte la partie` : `Victoire de l'équipe ${w.name}`) : "Égalité";
  m.endReason = reason; m.endedAt = Date.now(); m.phase = "finished";
  live.proposal = null;
  addLog(m, "end", "Fin de la partie : " + reason);
  haptic(true);
  touchMatch(m); render();
}
function victory(m){
  const ts = m.teams; if (ts.length < 2) return null;
  const al = ts.filter(t => aliveN(t) > 0);
  if (al.length <= 1) {
    if (al[0]) return {title:"Victoire de " + al[0].name, reason: MODES[m.mode].ffa ? `${al[0].name} est le dernier survivant` : `${al[0].name} est la dernière équipe en jeu`};
    return {title:"Tous éliminés", reason:"Tous les joueurs sont éliminés"};
  }
  const r = m.rules;
  if (MODES[m.mode].scoreLimit && r.scoreLimit > 0) { const t = ts.find(t => score(t) >= r.scoreLimit); if (t) return {title:"Victoire de " + t.name, reason:`${t.name} atteint ${r.scoreLimit} points`}; }
  if (MODES[m.mode].captures && r.captureLimit > 0) { const t = ts.find(t => t.captures >= r.captureLimit); if (t) return {title:"Victoire de " + t.name, reason:`${t.name} atteint ${r.captureLimit} captures`}; }
  return null;
}
/* Condition de victoire atteinte : pause + proposition. L'organisateur garde la main. */
function evaluate(m){
  if (!isActive(m) || live.id !== m.id) return;
  const v = victory(m);
  if (!v) { live.dismissed = null; return; }
  if (live.proposal || live.dismissed === v.reason) return;
  if (m.phase === "playing") { freeze(m, elapsed(m)); addLog(m, "pause", "Pause automatique : " + v.reason); touchMatch(m); }
  haptic(true);
  live.proposal = {...v, timeUp:false};
}

/* ---------- Statistiques ---------- */
const finished = () => Object.values(matches).filter(m => m.phase === "finished");
function playerStats(pid){
  const s = {games:0, wins:0, losses:0, draws:0, points:0, hits:0, elims:0, kos:0, mvp:0, perf:[]};
  finished().sort((a, b) => a.date - b.date).forEach(m => m.teams.forEach(t => t.participants.forEach(p => {
    if (p.playerId !== pid) return;
    s.games++; s.points += p.points; s.hits += p.hits; s.elims += p.elims; s.kos += p.kos;
    const won = m.winnerTeamId === t.id;
    if (won) s.wins++; else if (!m.winnerTeamId) s.draws++; else s.losses++;
    if (mvp(m) && mvp(m).id === p.id) s.mvp++;
    s.perf.push({date:m.date, points:p.points, won, name:m.name, matchId:m.id, team:t, p, draw:!m.winnerTeamId});
  })));
  s.rate = s.games ? s.wins / s.games : 0;
  s.avg = s.games ? s.points / s.games : 0;
  return s;
}
function teamStats(){
  const tab = {};
  finished().filter(m => !MODES[m.mode].ffa).forEach(m => m.teams.forEach(t => {
    const e = tab[t.name] || (tab[t.name] = {name:t.name, color:t.color, games:0, wins:0, total:0});
    e.games++; e.total += score(t); if (m.winnerTeamId === t.id) e.wins++;
  }));
  return Object.values(tab).map(e => ({...e, rate: e.games ? e.wins / e.games : 0, avg: e.games ? e.total / e.games : 0}))
    .sort((a, b) => b.wins - a.wins || b.rate - a.rate);
}
function split(players, n, strategy){
  const out = Array.from({length:n}, () => []);
  const ordered = strategy === "random"
    ? [...players].sort(() => Math.random() - .5)
    : players.map(p => { const s = playerStats(p.id); return [p, (s.games ? s.avg + s.rate * 10 : 0) + Math.random() * .01]; }).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  ordered.forEach((p, i) => { const round = Math.floor(i / n), pos = i % n; out[round % 2 === 0 ? pos : n - 1 - pos].push(p); });
  return out;
}

/* Composants */
const dot = c => `<span class="dot" style="--c:${cv(c)}"></span>`;
const tile = (label, val) => `<div class="tile"><b>${esc(val)}</b><span>${esc(label)}</span></div>`;
function stepper(label, root, path, value, display, min, max, step = 1){
  return `<div class="stepper"><span>${esc(label)}</span><div class="ctl">
    <button data-act="step" data-root="${root}" data-path="${path}" data-d="${-step}" data-min="${min}" data-max="${max}" aria-label="Moins" ${value <= min ? "disabled" : ""}>−</button>
    <output>${esc(display)}</output>
    <button data-act="step" data-root="${root}" data-path="${path}" data-d="${step}" data-min="${min}" data-max="${max}" aria-label="Plus" ${value >= max ? "disabled" : ""}>+</button></div></div>`;
}
const toggle = (label, root, path, on) => `<div class="stepper"><span>${esc(label)}</span><button class="toggle" data-act="toggle" data-root="${root}" data-path="${path}" aria-pressed="${!!on}" aria-label="${esc(label)}"></button></div>`;
function matchRow(m){
  const st = m.phase === "finished" ? `<span class="dim ellipsis" style="color:${m.winnerTeamId ? cv((findT(m, m.winnerTeamId)||{}).color) : "var(--muted)"}">${esc(m.winnerSummary)}</span>`
    : m.phase === "playing" ? `<span class="pill live">En cours</span>` : m.phase === "paused" ? `<span class="pill pause">En pause</span>` : `<span class="dim">Prête</span>`;
  return `<button class="tap" data-act="openMatch" data-id="${m.id}">
    <div class="row"><b class="grow ellipsis">${esc(m.name)}</b><span class="dim num" style="font-size:13px">${fmtDate(m.date)}</span></div>
    <div class="row" style="margin-top:4px;font-size:14px"><span class="chip">${esc(MODES[m.mode].title)}</span>
      <span class="grow row" style="gap:10px">${rankedTeams(m).slice(0,4).map(t => `<span class="row num" style="gap:5px">${dot(t.color)}<b>${score(t)}</b></span>`).join("")}</span>${st}</div></button>`;
}
function healthView(p, r, color, max = r.start){
  if (r.healthMode === "lives" && max <= 10) {
    let h = ""; for (let i = 0; i < max; i++) h += i < p.health ? "♥" : '<span class="x">♡</span>';
    return `<div class="hearts" aria-label="${p.health} vies">${h}</div>`;
  }
  const f = max ? clamp(p.health / max, 0, 1) : 0;
  const c = f > .5 ? cv(color) : f > .25 ? "var(--warn)" : "var(--danger)";
  return `<div class="bar"><div class="tr"><div class="fl" style="width:${f*100}%;--c:${c}"></div></div><span>${p.health}</span></div>`;
}

function rulesEditor(root, r, mode){
  const M = MODES[mode], hits = Math.ceil(r.start / Math.max(1, r.dmg));
  let h = `<div class="label">Temps</div><div class="card stack">
    ${stepper("Durée", root, "duration", r.duration, r.duration ? r.duration + " min" : "Illimitée", 0, 120)}

    <p class="note" style="margin:0">À la fin du temps, la partie se met en pause : vous terminez ou jouez une prolongation.</p></div>`;
  h += `<div class="label">Santé</div><div class="card stack">
    <div class="seg"><button data-act="healthMode" data-root="${root}" data-v="lives" aria-pressed="${r.healthMode === "lives"}">Vies</button><button data-act="healthMode" data-root="${root}" data-v="hp" aria-pressed="${r.healthMode === "hp"}">Points de vie</button></div>
    ${r.healthMode === "lives" ? stepper("Vies au départ", root, "start", r.start, r.start, 1, 20) : stepper("Points de vie au départ", root, "start", r.start, r.start + " PV", 10, 100, 10)}
    ${r.healthMode === "hp" ? stepper("Dégâts par touche", root, "dmg", r.dmg, r.dmg + " PV", 5, 100, 5) : ""}
    <p class="note" style="margin:0">${r.healthMode === "lives" ? "Chaque touche retire une vie." : `De 10 à 100 PV, comme le programme Circuit Playground. ${plural(hits, "touche")} pour mettre un joueur à 0.`}</p></div>`;
  h += `<div class="label">Réapparition</div><div class="card stack">${toggle("Réapparition après élimination", root, "respawn", r.respawn)}
    ${r.respawn ? stepper("Réapparitions max.", root, "maxRespawns", r.maxRespawns, r.maxRespawns ? r.maxRespawns : "Illimitées", 0, 20) : ""}
    ${r.respawn ? stepper("Délai avant réapparition", root, "respawnDelay", r.respawnDelay || 0, r.respawnDelay ? r.respawnDelay + " s" : "Immédiat", 0, 30, 5) : ""}
    <p class="note" style="margin:0">${r.respawn ? "Un joueur à 0 récupère toute sa santé (retour à la base)." : "Un joueur à 0 est éliminé jusqu'à la fin."}</p></div>`;
  h += `<div class="label">Points</div><div class="card stack">${stepper("Points par touche", root, "pph", r.pph, r.pph, 0, 10)}${stepper("Bonus par élimination", root, "ppe", r.ppe, r.ppe, 0, 20)}
    ${M.scoreLimit ? stepper("Score pour gagner", root, "scoreLimit", r.scoreLimit, r.scoreLimit || "Aucun", 0, 1000, 10) : ""}</div>`;
  h += upgRulesBlock(root, r);
  const lv = r.healthMode === "lives";
  h += `<div class="label">Station de soin</div><div class="card stack">
    ${stepper("Soin par tir", root, "healAmt", healEff(r), lv ? "+" + healEff(r) + " vie" + (healEff(r) > 1 ? "s" : "") : "+" + healEff(r) + " PV", lv ? 1 : 5, lv ? 5 : 100, lv ? 1 : 5)}
    ${stepper("Délai par joueur", root, "healCd", r.healCd || 30, (r.healCd || 30) + " s", 10, 180, 10)}
    <p class="note" style="margin:0">Pour utiliser une station, posez un blaster libre sur le terrain et choisissez « Station de soin » avant le départ.</p></div>`;
  h += `<div class="label">Bonus</div><div class="card stack">${toggle("Bonus (1 par joueur et par partie)", root, "powerups", r.powerups)}
    <p class="note" style="margin:0">Comme les power-ups de l'app Nerf : tir puissant (dégâts ×2), trousse de soin, ou soin d'un coéquipier. Chaque joueur en utilise un seul par partie, depuis sa fiche.</p></div>`;
  if (M.captures) h += `<div class="label">Capture the Flag</div><div class="card stack">${stepper("Points par capture", root, "ppc", r.ppc, r.ppc, 0, 50, 5)}${stepper("Captures pour gagner", root, "captureLimit", r.captureLimit, r.captureLimit || "Aucune limite", 0, 10)}</div>`;
  if (M.zones) h += `<div class="label">Domination</div><div class="card stack">${stepper("Nombre de zones", root, "zones", r.zones, r.zones, 1, 5)}${stepper("Points par zone", root, "ppz", r.ppz, r.ppz, 1, 10)}${stepper("Toutes les", root, "zoneTick", r.zoneTick, r.zoneTick + " s", 5, 60, 5)}
    <p class="note" style="margin:0">Pendant la partie, indiquez qui contrôle chaque zone : les points s'ajoutent tout seuls.</p></div>`;
  return h;
}

      <button class="btn primary block" data-act="createGame" data-launch="1" ${msg ? "disabled" : ""}>▶ Créer et ouvrir la partie</button>
      <button class="btn ghost block" data-act="createGame" ${msg ? "disabled" : ""}>Enregistrer pour plus tard</button></div>`;
    return h;
  }
};
function ngValidation(){
  const d = draft, sel = core.players.filter(p => d.ids.includes(p.id));
  if (!d.name.trim()) return "Donnez un nom à la partie.";
  if (sel.length < 2) return "Sélectionnez au moins 2 joueurs.";
  if (!MODES[d.mode].ffa) for (let i = 0; i < d.slots.length; i++) if (!sel.some(p => d.assign[p.id] === i)) return `L'équipe ${d.slots[i].name} n'a aucun joueur.`;
  return null;
}
function syncAssign(){
  const d = draft;
  Object.keys(d.assign).forEach(id => { if (!d.ids.includes(id) || d.assign[id] >= d.slots.length) delete d.assign[id]; });
  d.ids.forEach(id => {
    if (d.assign[id] != null) return;
    const counts = d.slots.map((_, i) => Object.values(d.assign).filter(v => v === i).length);
    d.assign[id] = counts.indexOf(Math.min(...counts));
  });
}

function lineChart(pts){
  const W = 320, H = 150, L = 30, R = 10, T = 12, B = 22;
  const max = Math.max(5, ...pts.map(p => p.points));
  const top = Math.ceil(max / 5) * 5;
  const x = i => pts.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - v / top);
  const ticks = [0, top / 2, top];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Points par partie">`;
  ticks.forEach(t => { s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="var(--dim)">${t}</text>`; });
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.points).toFixed(1)}`).join("");
  if (pts.length > 1) s += `<path d="${path} L${x(pts.length - 1)},${y(0)} L${x(0)},${y(0)} Z" fill="var(--accent)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { s += `<circle cx="${x(i)}" cy="${y(p.points)}" r="${i === pts.length - 1 ? 5 : 3.8}" fill="${p.won ? "var(--ok)" : "var(--danger)"}" stroke="var(--surface)" stroke-width="1.5"/>`; });
  const first = pts[0], last = pts[pts.length - 1];
  s += `<text x="${x(0)}" y="${H - 6}" font-size="10" fill="var(--dim)" text-anchor="${pts.length === 1 ? "middle" : "start"}">${fmtDate(first.date)}</text>`;
  if (pts.length > 1) s += `<text x="${x(pts.length - 1)}" y="${H - 6}" font-size="10" fill="var(--dim)" text-anchor="end">${fmtDate(last.date)}</text>`;
  return s + "</svg>";
}

  s.hidden = false;

function bonusSection(m, p, opp){
  if (!m.rules.powerups || !isActive(m)) return "";
  if (p.puUsed) return `<p class="note" style="margin-top:14px">⚡ Bonus déjà utilisé pendant cette partie.</p>`;
  if (p.out || waiting(p)) return "";
  const allies = MODES[m.mode].ffa ? [] : (teamOf(m, p) || {participants:[]}).participants.filter(a => a.id !== p.id && !a.out && !waiting(a) && a.health < maxH(m, a));
  const amt = m.rules.healthMode === "lives" ? "+2 vies" : "+50 PV";
  return `<div class="label" style="margin-top:14px;color:var(--gold)">⚡ Bonus<small>1 seul par partie</small></div><div class="card flush list" style="margin-top:6px">
    ${opp.map(o => `<button class="tap row" data-act="puShot" data-p="${p.id}" data-v="${o.id}">${dot((teamOf(m, o)||{}).color)}<span class="grow">Tir puissant sur <b>${esc(pName(o))}</b></span><span class="dim" style="font-size:12px">dégâts ×2</span></button>`).join("")}
    <button class="tap row" data-act="puHeal" data-p="${p.id}" data-t="${p.id}" ${p.health >= maxH(m, p) ? "disabled" : ""}><span class="grow">Trousse de soin</span><span class="dim" style="font-size:12px">${amt}</span></button>
    ${allies.map(a => `<button class="tap row" data-act="puHeal" data-p="${p.id}" data-t="${a.id}"><span class="grow">Soigner <b>${esc(pName(a))}</b></span><span class="dim" style="font-size:12px">${amt}</span></button>`).join("")}</div>`;
}

/* ---------- Actions ---------- */
function setPath(rootName, path, val){
  const roots = {draft, settings:core.settings, mr, form, "draft.rules":draft && draft.rules, "mr.rules":mr && mr.rules};
  let obj = roots[rootName]; const parts = path.split(".");
  while (parts.length > 1) obj = obj[parts.shift()];
  obj[parts[0]] = val;
  afterSet(rootName);
}
function getPath(rootName, path){
  const roots = {draft, settings:core.settings, mr, form, "draft.rules":draft && draft.rules, "mr.rules":mr && mr.rules};
  return path.split(".").reduce((o, k) => o[k], roots[rootName]);
}
function afterSet(rootName){
  if (rootName === "settings") touchCore();
  if (rootName === "mr.rules" || rootName === "mr") saveModeRules();
}
function saveModeRules(){
  const k = mr.mode, gen = generatedRules(k);
  clampRules(mr.rules);
  if (JSON.stringify(mr.rules) === JSON.stringify(gen)) delete core.modeRules[k]; else core.modeRules[k] = clone(mr.rules);
  touchCore();
}
function getMatch(){ return matches[live.id]; }
function openLive(id){
  live.id = id; live.proposal = null; live.overtime = false; live.dismissed = null;
  const m = matches[id]; const lim = m && limitOf(m);
  if (m && lim && elapsed(m) >= lim && isActive(m)) live.overtime = true;
  stack.push({v:"live", id}); render(); window.scrollTo(0, 0); wakeLock(true);
}
function closeLive(){
  closeSheet(); cancelCountdown();
  live.id = null; live.proposal = null;
  if (cur().v === "live") stack.pop();
  if (!stack.length) stack = [{v:tab}];
  wakeLock(false); render(); window.scrollTo(0, 0);
}
async function wakeLock(on){
  try {
    if (on && core.settings.keepAwake && navigator.wakeLock) live.wake = await navigator.wakeLock.request("screen");
    else if (!on && live.wake) { await live.wake.release(); live.wake = null; }
  } catch (e) {}
}
function startCountdown(m){
  const n = m.rules.countdown;
  if (!n) { startMatch(m); haptic(true); return; }
  let v = n; const box = $("#countdown");
  const draw = () => { box.innerHTML = `<div class="muted" style="font-family:var(--f-display);letter-spacing:.3em;font-weight:700">PRÊTS ?</div><b>${v}</b><button class="btn ghost" data-act="cancelCountdown">Annuler</button>`; };
  box.hidden = false; draw(); haptic();
  live.cdTimer = setInterval(() => {
    v--;
    if (v <= 0) { cancelCountdown(); startMatch(m); haptic(true); return; }
    draw(); haptic();
  }, 1000);
}
function cancelCountdown(){ clearInterval(live.cdTimer); live.cdTimer = null; $("#countdown").hidden = true; }

function loadDemo(){
  const names = ["Alex","Bastien","Chloé","Dylan","Emma","Félix","Gabriel","Hugo"];
  const ps = names.map(n => ({id:uid(), name:n, callsign:"", createdAt:Date.now()}));
  core.players.push(...ps);
  core.teams.push({id:uid(), name:"Rouge", color:"red", playerIds:ps.slice(0,4).map(p => p.id)}, {id:uid(), name:"Bleu", color:"blue", playerIds:ps.slice(4).map(p => p.id)});
  core.equipment.push({id:uid(), name:"AlphaPoint A1", kind:"blaster", model:"Nerf Laser Ops Pro AlphaPoint", tag:"A1", status:"ready", battery:"", notes:""},
    {id:uid(), name:"AlphaPoint A2", kind:"blaster", model:"Nerf Laser Ops Pro AlphaPoint", tag:"A2", status:"charging", battery:"", notes:""},
    {id:uid(), name:"DeltaBurst D1", kind:"blaster", model:"Nerf Laser Ops Pro DeltaBurst", tag:"D1", status:"ready", battery:"", notes:""},
    {id:uid(), name:"Drapeau rouge", kind:"flag", model:"", tag:"", status:"ready", battery:"", notes:""});
  ["tdm","elim","ctf","lms","dom"].forEach((mode, i) => {
    const r = baseRules(mode);
    const teams = MODES[mode].ffa ? [...ps].sort(() => Math.random() - .5).slice(0, 6).map((p, j) => ({name:p.name, color:colorAt(j), players:[p]}))
      : split(ps, 2, "random").map((g, j) => ({name: j ? "Bleu" : "Rouge", color: colorAt(j), players:g}));
    const date = Date.now() - (5 - i) * 3 * 86400000;
    const m = createMatch({name:"Exemple – " + MODES[mode].title, date, mode, rules:r, teams});
    const dur = Math.max(1, r.duration) * 60 * (0.6 + Math.random() * .4);
    allP(m).forEach(p => { p.hits = 2 + Math.floor(Math.random() * 11); p.elims = Math.floor(Math.random() * 4); p.kos = r.respawn ? Math.floor(Math.random() * 4) : 0; p.points = p.hits * r.pph + p.elims * r.ppe; });
    if (!r.respawn) { const surv = m.teams[Math.floor(Math.random() * m.teams.length)]; m.teams.forEach(t => t.participants.forEach((p, j) => { const out = t !== surv || j > 0; p.out = out; p.kos = out ? 1 : 0; p.health = out ? 0 : 1 + Math.floor(Math.random() * r.start); p.outAt = out ? 30 + Math.random() * (dur - 30) : null; })); }
    m.teams.forEach(t => { if (mode === "ctf") { t.captures = Math.floor(Math.random() * 4); t.objective = t.captures * r.ppc; } if (mode === "dom") t.objective = 20 + Math.floor(Math.random() * 60); });
    m.startedAt = date; m.acc = dur; m.phase = "finished"; m.endedAt = date + dur * 1000;
    const w = winnerOf(m); m.winnerTeamId = w ? w.id : null;
    m.winnerSummary = w ? (MODES[mode].ffa ? `${w.name} remporte la partie` : `Victoire de l'équipe ${w.name}`) : "Égalité";
    m.endReason = "Partie d'exemple"; touchMatch(m);
  });
  touchCore(); toast("Exemple chargé : 8 joueurs, 2 équipes, 5 parties."); render();
}

/* ---------- Horloge ---------- */
let lastHb = 0;
setInterval(() => {
  const m = live.id && matches[live.id];
  if (!m || cur().v !== "live") return;
  const now = Date.now();
  if (m.phase === "playing") {
    if (now - lastHb > 5000) { lastHb = now; try { localStorage.setItem(LS + ".hb." + m.id, String(now)); } catch (e) {} }
    const e = elapsed(m, now);
    const changed = awardTicks(m, e);
    const back = allP(m).filter(p => waiting(p) && e >= p.waitUntil);
    if (back.length) {
      back.forEach(p => { p.waitUntil = null; p.health = maxH(m, p); addLog(m, "respawn", `${pName(p)} réapparaît`); });
      haptic(); touchMatch(m); render(); return;
    }
    const lim = limitOf(m);
    if (lim && e >= lim && !live.overtime && !live.proposal) {
      freeze(m, lim); addLog(m, "pause", "Temps écoulé"); touchMatch(m);
      live.proposal = {title:"Temps écoulé", reason:"Temps écoulé", timeUp:true}; haptic(true); render(); return;
    }
    if (changed || live.proposal) { render(); return; }
  }
  updateClock();
}, 250);

/* Partie interrompue (onglet fermé longtemps) : remise en pause au dernier signe de vie. */
function recover(){
  Object.values(matches).forEach(m => {
    if (m.phase !== "playing") return;
    let hb = null; try { hb = Number(localStorage.getItem(LS + ".hb." + m.id)); } catch (e) {}
    if (hb && Date.now() - hb > 90000) { m.acc = elapsed(m, hb); m.resumedAt = null; m.phase = "paused"; addLog(m, "pause", "Pause automatique (page rouverte)"); touchMatch(m); }
  });
}

/* ---------- Blasters Bluetooth (Nerf Laser Ops Pro) ----------

   le blaster envoie « touché » avec le n° du tireur ; l'app attribue un n° à chaque blaster. */
const BT_SERVICE = "073e1435-85d1-455c-97cd-0b8262f20eac";
const BT_NOTIFY  = "073e1382-85d1-455c-97cd-0b8262f20eac";
const BT_WRITE   = "073e1383-85d1-455c-97cd-0b8262f20eac";

async function btAdd(){
  if (!bt.supported) { toast("Bluetooth indisponible : Chrome sur Android ou Mac, ou Bluefy sur iPhone."); return; }
  let device;
  try { device = await navigator.bluetooth.requestDevice({filters:[{services:[BT_SERVICE]}]}); }
  catch (e) {
    if (!/cancel/i.test(e.message)) toast(/permission|policy|allowed|disallowed/i.test(e.message) ? "Le Bluetooth est bloqué dans cette page. Ouvrez Laser Arena directement dans le navigateur." : "Bluetooth : " + e.message);
    return;
  }
  let b = bt.list.get(device.id);
  if (!b) {
    bt.seq++;
    b = {id:device.id, device, label:"B" + bt.seq, write:null, notify:null, chain:Promise.resolve(), team:null, pid:null, hp:null, ammo:null, bat:null, dmg:2, retries:0};
    bt.list.set(device.id, b);
    device.addEventListener("gattserverdisconnected", () => btLost(b));
  }
  await btConnect(b);
}
async function btConnect(b){
  try {
    const server = await b.device.gatt.connect();
    const svc = await server.getPrimaryService(BT_SERVICE);
    const n = await svc.getCharacteristic(BT_NOTIFY);
    b.write = await svc.getCharacteristic(BT_WRITE);
    if (!b.notify) { n.addEventListener("characteristicvaluechanged", e => btDecode(b, new Uint8Array(e.target.value.buffer))); b.notify = n; }
    await n.startNotifications();
    b.retries = 0;
    setTimeout(() => toast(`${bName(b)} connecté`), 400); // le nom arrive avec la réponse 0x35
    [0x35, 0x33, 0x38, 0x51].forEach(c => btSend(b, [c]));
    btRefresh();
  } catch (e) { b.write = null; toast(`Blaster ${b.label} : connexion impossible (${e.message})`); btRefresh(); }
}
/* Perte de connexion : 3 tentatives automatiques si une partie est ouverte. */
function btLost(b){
  b.write = null; btRefresh();
  const m = live.id && matches[live.id];
  if (m && isActive(m) && allP(m).some(p => p.blasterId === b.id) && b.retries < 3) {
    b.retries++; toast(`Blaster ${b.label} déconnecté, reconnexion…`);
    setTimeout(() => btConnect(b), 1500);
  }
}
/* Envoi en file : une commande à la fois, espacées de 0,12 s (comme l'app officielle). */
function btSend(b, bytes){
  b.chain = b.chain.then(async () => {
    if (!b.write) return;
    const data = new Uint8Array(bytes);
    try { if (b.write.writeValueWithoutResponse) await b.write.writeValueWithoutResponse(data); else await b.write.writeValue(data); } catch (e) {}
    await new Promise(r => setTimeout(r, 120));
  });
  return b.chain;
}
function btDecode(b, d){
  switch (d[0]) {
    case 0x30: btHit(b, d); break;                    // touché : équipe tireur, n° tireur, dégâts, santé
    case 0x32: b.ammo = d[2]; btShot(b); break;      // tir pendant la partie
    case 0x31: case 0x3a: b.ammo = d[1]; break;
    case 0x33: b.team = d[1]; break;
    case 0x35: b.dmg = d[3] || 2; b.ammoMax = d[2]; b.cooldown = d[12]; btIdentify(b, d[9], d[10]); break;
    case 0x38: b.hp = d[1]; break;
    case 0x3f: btBack(b); break;                      // retour en jeu après le délai du blaster
    case 0x51: b.bat = (d[1] << 8) | d[2]; btBattery(b); break;    // centièmes de volt

  btRefresh(true);
}
let btRenderTimer = null;

/* Une touche signalée par le blaster devient une touche dans l'app (avec le tireur). */

  const profs = Object.entries(core.blasters || {}).sort((a, b) => profName(a[0], a[1]).localeCompare(profName(b[0], b[1])));
  const pending = [...bt.list.values()].filter(b => b.write && !b.key);
  let h = `<div class="card stack"><div class="label">Blasters<small>${btConnected().length} connecté(s) · ${profs.length} enregistré(s)</small></div>
    ${bt.supported ? `<button class="btn primary block" data-act="btAdd">＋ Connecter un blaster Nerf Laser Ops Pro</button>` : `<p class="muted" style="margin:0">Ce navigateur ne gère pas le Bluetooth : Chrome sur Android ou Mac, ou Bluefy sur iPhone. Les fiches restent consultables.</p>`}
    <p class="note" style="margin:0">Chaque blaster est reconnu grâce à son nom d'origine, gardé dans le blaster. Touchez-le pour un surnom, les piles, son état ou sa classe.</p></div>`;
  if (!profs.length && !pending.length) return h;
  h += `<div class="card flush list">${pending.map(b => `<div class="row"><span class="dot" style="--c:var(--ok)"></span><span class="grow">Blaster ${esc(b.label)} <span class="dim">· identification…</span></span></div>`).join("")}
    ${profs.map(([k, pr]) => {
      const b = [...bt.list.values()].find(x => x.key === k && x.write), st = EQ_STATUS[pr.status || "ready"], low = pr.bat && pr.bat < BAT_LOW;
      const sub = [pr.name && pr.official ? pr.official : "", pr.bat ? (low ? "⚠ " : "") + batTxt(pr.bat) : "", pr.battChangedAt ? "piles " + fmtDate(pr.battChangedAt) : "", upgSpent(pr.upg || ZERO_UPG()) ? "classe " + ((PRESETS[presetOf(pr.upg)] || {name:"perso"}).name) : ""].filter(Boolean).join(" · ");
      return `<div class="row"><button class="tap row grow" style="width:auto" data-act="editBlaster" data-k="${esc(k)}"><span class="dot" style="--c:${b ? "var(--ok)" : "var(--dim)"}" title="${b ? "connecté" : "pas connecté"}"></span>
        <div class="grow" style="min-width:0"><b>${esc(profName(k, pr))}</b> ${pr.status && pr.status !== "ready" ? `<span style="color:${st.c};font-size:12px;font-weight:700">${st.n}</span>` : ""}<div class="dim ellipsis" style="font-size:12px;${low ? "color:var(--warn)" : ""}">${esc(sub || "–")}</div></div></button>
        ${b ? `<button class="btn ghost" style="padding:7px 10px" data-act="btBlink" data-id="${esc(b.id)}">Identifier</button>` : ""}</div>`; }).join("")}</div>`;
  return h;
}

/* Santé à régler sur le blaster pour qu'il tombe à 0 au même moment que dans l'app. */
function btHpFor(m, p, b){
  const r = m.rules, hits = r.healthMode === "lives" ? maxH(m, p) : Math.ceil(maxH(m, p) / dmgOf(r));
  return clamp(hits * (b.dmg || 2), 1, 255);
}
/* Départ : n° de joueur + équipe + santé, puis départ de la partie sur chaque blaster associé. */
/* ---------- Objets de jeu ----------
   Un blaster libre posé sur le terrain devient une cible : on tire dessus pour se soigner,
   ou pour prendre une zone (Domination). Le blaster indique le n° du tireur, donc l'app sait qui l'a touché. */
const healEff = r => r.healAmt || (r.healthMode === "lives" ? 1 : 25);
function hpToBlaster(m, p, b){
  const r = m.rules, hits = r.healthMode === "lives" ? p.health : Math.ceil(p.health / dmgOf(r));
  return clamp(hits * (b.dmg || 2), 1, 255);
}
function btStationHit(m, b, st, d){
  btSend(b, [0x39, 255]); // l'objet ne tombe jamais à 0
  if (m.phase !== "playing") return;
  const shooter = allP(m).find(p => p.pid === d[2] && p.blasterId);
  const label = st.role === "heal" ? "station de soin" : `zone ${ZONE(st.zone)}`;
  if (!shooter) { addLog(m, "bonus", `Tir sur la ${label} par un blaster inconnu (n° ${d[2]})`); touchMatch(m); return; }
  if (shooter.out || waiting(shooter)) return;
  if (st.role === "zone") { const t = teamOf(m, shooter); if (t) setZone(m, st.zone, t.id); return; }
  const cd = (m.rules.healCd || 30) * 1000, now = Date.now();
  if (shooter.healAt && now - shooter.healAt < cd) { toast(`${pName(shooter)} : station disponible dans ${Math.ceil((cd - (now - shooter.healAt)) / 1000)} s`); return; }
  if (shooter.health >= maxH(m, shooter)) { toast(`${pName(shooter)} a déjà toute sa santé`); return; }
  const amt = healEff(m.rules);
  record(m, "bonus", `♥ ${pName(shooter)} se soigne à la station (+${amt}${m.rules.healthMode === "lives" ? " vie" : " PV"})`, {ps:[shooter]}, () => {
    shooter.health = Math.min(maxH(m, shooter), shooter.health + amt); shooter.healAt = now;
  });
  const sb = btOf(shooter); if (sb && sb.write) btSend(sb, [0x39, hpToBlaster(m, shooter, sb)]);
}
function btStationsCard(m){
  const ids = Object.keys(m.stations || {}); if (!ids.length || m.phase === "setup") return "";
  return `<div class="card stack"><div class="label">Objets de jeu</div>${ids.map(id => { const st = m.stations[id], b = bt.list.get(id);
    return `<div class="row"><b class="grow">${st.role === "heal" ? "♥ Station de soin" : "⚑ Zone " + ZONE(st.zone)}</b><span class="dim" style="font-size:13px">${b ? esc(bName(b)) + (b.write ? "" : " · déconnecté") : "blaster absent"}</span></div>`; }).join("")}
    <p class="note" style="margin:0">${ids.some(id => m.stations[id].role === "heal") ? `Soin : +${healEff(m.rules)}${m.rules.healthMode === "lives" ? " vie" : " PV"}, une fois toutes les ${m.rules.healCd || 30} s par joueur.` : ""}</p></div>`;
}

/* Santé et dégâts des réglages : appliqués au départ, avec ou sans blaster. */
function applyUpgrades(m){
  const lives = m.rules.healthMode === "lives";
  allP(m).forEach(p => {
    const u = upgFor(m, p); if (!u) return;
    if (u.hp) { p.maxH = Math.max(1, maxH(m, p) + u.hp * (lives ? 1 : 10)); p.health = p.maxH; }
    p.dmgBonus = (u.dmg || 0) * 5;
  });
  const mode = m.rules.upgMode || "none";
  if (mode !== "none") addLog(m, "start", mode === "all" ? `Réglages pour tous : ${upgSummary(m.rules.upgAll, m.rules)}` : "Réglages propres à chaque blaster appliqués");
}
function btStart(m){
  applyUpgrades(m);
  const linked = allP(m).filter(p => btOf(p) && btOf(p).write);
  if (!linked.length && !Object.keys(m.stations || {}).length) return;
  const ffa = MODES[m.mode].ffa;
  allP(m).forEach((p, i) => { p.pid = i + 1; });
  linked.forEach(p => {
    const b = btOf(p), t = teamOf(m, p), pr = bProf(b);
    const team = ffa ? 2 : Math.min(t.order, 1);
    p.blasterKey = b.key || null; p.blasterName = bName(b);
    const u = upgFor(m, p) || ZERO_UPG();
    btSend(b, [0x49, p.pid, team]); btSend(b, [0x39, btHpFor(m, p, b)]);
    if (u.ammo) btSend(b, [0x3b, clamp((b.ammoMax || 10) + u.ammo * 2, 1, 99)]);
    if (u.resp) btSend(b, [0x3c, clamp((b.cooldown || 10) - u.resp * 2, 2, 60)]);
    btSend(b, [0x41, 0, 0]);
  });
  Object.keys(m.stations || {}).forEach((id, i) => { const b = bt.list.get(id); if (b && b.write) { btSend(b, [0x49, 100 + i, 2]); btSend(b, [0x39, 255]); btSend(b, [0x41, 0, 0]); } });
  addLog(m, "start", `${linked.length} blaster(s) synchronisé(s)${Object.keys(m.stations || {}).length ? ", " + Object.keys(m.stations).length + " objet(s) de jeu" : ""}`);
}
function btEnd(m){
  let gained = 0;
  allP(m).forEach(p => {
    const b = btOf(p); if (b && b.write) btSend(b, [0x42]);
    const pr = p.blasterKey && core.blasters && core.blasters[p.blasterKey];
    if (pr) { pr.games = (pr.games || 0) + 1; gained++; }
  });
  if (gained) touchCore();
}
function btBadge(m, p){
  if (!p.blasterId) return "";
  const b = bt.list.get(p.blasterId);
  if (!b || !b.write) return ` <span class="pill pause">blaster déconnecté</span>`;
  return ` <span class="dim" style="font-size:12px">📡 ${esc(bName(b))}${b.bat ? " · " + (b.bat / 100).toFixed(1) + " V" : ""}${p.shots ? " · " + p.shots + " tirs" : ""}</span>`;
}
function btSetupCard(m){
  const ps = allP(m), conn = btConnected();
  const tooMany = !MODES[m.mode].ffa && m.teams.length > 2;
  if (!bt.supported) return `<div class="card"><b>Blasters Bluetooth</b><p class="muted" style="margin:6px 0 0">Ce navigateur ne gère pas le Bluetooth. Pour relier les blasters : Chrome sur Android ou sur Mac, ou l'app Bluefy sur iPhone. La saisie manuelle fonctionne partout.</p></div>`;
  let h = `<div class="card stack"><div class="label">Blasters Bluetooth<small>${conn.length} connecté(s)</small></div>
    <p class="note" style="margin:0">Optionnel. Un blaster associé compte tout seul les touches (avec le tireur) et ses tirs. Sans blaster, la saisie manuelle reste disponible.</p>
    ${tooMany ? `<p class="note" style="margin:0;color:var(--warn)">Les blasters ne gèrent que 2 équipes (rouge et bleu) : les équipes 3 et 4 seront réglées en bleu.</p>` : ""}
    <div class="row" style="flex-wrap:wrap"><button class="btn primary" data-act="btAdd">＋ Connecter un blaster</button>${conn.length ? `<button class="btn ghost" data-act="btAuto">Associer dans l'ordre</button>` : ""}</div>
    <label class="field"><span>Réglages des blasters pour cette partie</span><select class="input" data-act-change="liveUpgMode">${Object.entries(UPG_MODES).map(([k, n]) => `<option value="${k}" ${(m.rules.upgMode || "none") === k ? "selected" : ""}>${n}</option>`).join("")}</select></label>
    ${(m.rules.upgMode || "none") === "all" ? `<p class="note" style="margin:0">Pour tous : ${esc(upgSummary(m.rules.upgAll, m.rules))}. À modifier dans Réglages › Modes de jeu, ou à la création de la partie.</p>` : ""}`;
  if (conn.length) h += `<div class="list">${ps.map(p => `<div class="row"><span class="grow"><b>${esc(pName(p))}</b> ${dot((teamOf(m, p)||{}).color)}</span>
      <select class="input" style="width:auto;padding:6px 8px" data-act-change="btLink" data-p="${p.id}" aria-label="Blaster de ${esc(pName(p))}">
      <option value="">Saisie manuelle</option>${conn.map(b => `<option value="${esc(b.id)}" ${p.blasterId === b.id ? "selected" : ""}>${esc(bName(b))}${bProf(b) && upgSpent(bProf(b)) ? " · " + (PRESETS[presetOf(bProf(b).upg)] || {name:"perso"}).name : ""}${b.bat ? " (" + (b.bat / 100).toFixed(1) + " V)" : ""}</option>`).join("")}</select>${(m.rules.upgMode || "none") === "each" && btOf(p) && btOf(p).key ? `<button class="btn ghost" style="padding:7px 10px" data-act="editBlaster" data-k="${esc(btOf(p).key)}" title="${esc(upgSummary(bProf(btOf(p)).upg, m.rules))}">Régler</button>` : ""}</div>`).join("")}</div>`;
  const free = conn.filter(b => !ps.some(p => p.blasterId === b.id));
  if (free.length) {
    const zones = MODES[m.mode].zones ? m.zoneOwners.map((_, i) => `<option value="zone:${i}">Zone ${ZONE(i)} (on tire dessus pour la prendre)</option>`) : [];
    h += `<div class="label" style="margin-top:6px">Objets de jeu<small>blasters libres</small></div>
      <p class="note" style="margin:0">Un blaster posé sur le terrain sert de cible : tirez dessus pour regagner de la santé, ou pour prendre une zone. À tester sur le terrain.</p>
      <div class="list">${free.map(b => { const st = (m.stations || {})[b.id], v = st ? (st.role === "zone" ? "zone:" + st.zone : "heal") : "";
        return `<div class="row"><b class="grow">${esc(bName(b))}</b><select class="input" style="width:auto;padding:6px 8px" data-act-change="btRole" data-id="${esc(b.id)}" aria-label="Rôle de ${esc(bName(b))}">
          <option value="">Pas utilisé</option><option value="heal">♥ Station de soin</option>${zones.join("")}</select></div>`.replace(`value="${v}"`, `value="${v}" selected`); }).join("")}</div>`;
  }
  return h + `</div>`;
}

/* ---------- Démarrage ---------- */
loadLocal();
recover();
render();
initDb();
</script>
</body></html>
